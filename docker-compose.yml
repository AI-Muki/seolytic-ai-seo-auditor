services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seolytic
      POSTGRES_USER: seolytic
      POSTGRES_PASSWORD: seolytic
    ports:
      - "5432:5432"
    volumes:
      - seolytic-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - postgres
      - redis

volumes:
  seolytic-postgres: